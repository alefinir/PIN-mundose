# kubernetes/prometheus/prometheus-stack.yaml

# -----------------------------------------------------------------------------
# Configuración del servicio de Grafana
# -----------------------------------------------------------------------------
grafana:
  # Expone el servicio de Grafana a través de un Elastic Load Balancer (ELB) de AWS.
  # Esto te dará una URL pública para acceder al dashboard.
  service:
    type: LoadBalancer
  
  # Habilita el sidecar de Grafana para que automáticamente descubra
  # y cargue dashboards desde ConfigMaps.
  sidecar:
    dashboards:
      enabled: true
      # El label que el sidecar buscará en los ConfigMaps para identificar
      # los archivos de dashboards. Debe coincidir con el label de tu
      # ConfigMap del dashboard.
      label: "grafana_dashboard"

# -----------------------------------------------------------------------------
# Configuración de Prometheus
# -----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Configuración de almacenamiento persistente para Prometheus.
    # Es crucial para evitar la pérdida de métricas en caso de reinicio del pod.
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Define la clase de almacenamiento. 'gp2' es común en EKS.
          storageClassName: "gp2"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              # Tamaño del volumen de almacenamiento. 10Gi es un buen punto de partida.
              storage: 10Gi
    
    # Habilita la autodescubrimiento de ServiceMonitors y PodMonitors.
    # La configuración por defecto del stack ya incluye estas reglas,
    # pero a veces es útil definirlas explícitamente.
    podMonitorSelector: {}
    serviceMonitorSelector: {}

# -----------------------------------------------------------------------------
# Configuración del servidor de NGINX Ingress Controller
# -----------------------------------------------------------------------------
# Esta sección es opcional, pero si usas el Ingress Controller de NGINX
# instalado por el stack de Prometheus, esta configuración asegura que se monitoree.
nginx-ingress-controller:
  enabled: true